workflows:
  gayit-apk-tam-surum:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: Expo Prebuild (Android Klasörünü Oluştur)
        script: npx expo prebuild --platform android
      - name: Android AAB Üret (Release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: GAYİT Mührünü Bas (Jarsigner)
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/keystore.jks -storepass $CM_KEYSTORE_PASSWORD -keypass $CM_KEY_PASSWORD android/app/build/outputs/bundle/release/app-release.aab $CM_KEY_ALIAS
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
