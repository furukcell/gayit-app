workflows:
  gayit-apk-tam-surum:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - gayit
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Keystore Hazırla
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks

      - name: Cache Temizle
        script: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force

      - name: Bağımlılıkları Yükle
        script: npm install --legacy-peer-deps

      - name: Expo Prebuild (Android Klasörünü Oluştur)
        script: npx expo prebuild --platform android --clean

      - name: Target SDK 36 Ayarla
        script: |
          cd $CM_BUILD_DIR
          python3 -c "
          import re
          for path in ['android/build.gradle', 'android/app/build.gradle']:
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r'targetSdkVersion\s*=?\s*3[0-9]', 'targetSdkVersion = 36', content)
              content = re.sub(r'targetSdkVersion\s*=\s*Integer\.parseInt.*', 'targetSdkVersion = 36', content)
              with open(path, 'w') as f:
                  f.write(content)
              print(f'Done: {path}')
          "
          grep -n "targetSdk" android/build.gradle
          grep -n "targetSdk" android/app/build.gradle

      - name: Doğrulama Dosyasını Yerleştir
        script: |
          mkdir -p android/app/src/main/assets
          cp assets/adi-registration.properties android/app/src/main/assets/adi-registration.properties

      - name: Android AAB Üret ve İmzala (Release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

      - name: Android APK Üret ve İmzala (Release)
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
