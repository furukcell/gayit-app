workflows:
  gayit-apk-tam-surum:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - gayit
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Keystore Hazırla
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: Expo Prebuild (Android Klasörünü Oluştur)
        script: npx expo prebuild --platform android
      - name: Target SDK 35 Ayarla
        script: |
          sed -i '' 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/app/build.gradle
          sed -i '' 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle
      - name: Doğrulama Dosyasını Yerleştir
        script: |
          mkdir -p android/app/src/main/assets
          cp assets/adi-registration.properties android/app/src/main/assets/adi-registration.properties
      - name: Android AAB Üret ve İmzala (Release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
      - name: Android APK Üret ve İmzala (Release)
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
