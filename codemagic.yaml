workflows:
  react-native-android:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: Expo CLI Kur
        script: npm install -g expo-cli eas-cli
      - name: APK Oluştur (Full Build)
        script: |
          npx eas-cli build --platform android --profile preview --non-interactive --local
    artifacts:
      - build-*.apk
      - app-release.apk
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
