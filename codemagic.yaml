workflows:
  gayit-apk-tam-surum:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: Expo Prebuild (Android Klasörünü Oluştur)
        script: npx expo prebuild --platform android
      - name: Android APK Üret (Release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
