workflows:
  react-native-android:
    name: GAYİT APK Pişirici
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: APK Oluştur
        script: npx expo export --platform android
    artifacts:
      - dist/bundles/*.apk
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
