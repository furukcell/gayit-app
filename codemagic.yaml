workflows:
  gayit-apk-tam-surum:
    name: GAYİT APK Tam Sürüm
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Bağımlılıkları Yükle
        script: npm install
      - name: Expo Prebuild (Android Klasörünü Oluştur)
        script: npx expo prebuild --platform android
      - name: Android AAB Üret (Release)
        script: |
          cd android
          echo $CM_KEYSTORE | base64 --decode > app/keystore.jks
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=keystore.jks -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
